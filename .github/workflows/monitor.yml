name: Birja Telegram monitor

on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: birja-telegram-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Kutubxonalarni o'rnatish
        run: python -m pip install -r requirements.txt

      - name: Kanallarni tekshirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
          ALERT_ALL_DOCUMENTS: "true"
        run: python public_monitor.py --once

      - name: Oxirgi post raqamlarini saqlash
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "Yangi holat yo'q."
          else
            git commit -m "Monitor holatini yangilash [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
