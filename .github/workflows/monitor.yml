name: Birja Telegram monitor

on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: birja-telegram-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Kutubxonalarni o'rnatish
        run: python -m pip install -r requirements.txt

      - name: Kanallarni tekshirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.5-flash-lite"
          AI_ENABLED: "true"
          ALERT_ALL_DOCUMENTS: "true"
        run: python public_monitor.py --once

      - name: Oxirgi post raqamlarini saqlash
        if: always()
        env:
          MONITOR_STATE_SNAPSHOT: ${{ runner.temp }}/monitor-state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp data/state.json "$MONITOR_STATE_SNAPSHOT"
          git restore data/state.json

          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git switch -C monitor-state-update "origin/$GITHUB_REF_NAME"

            python - "$MONITOR_STATE_SNAPSHOT" <<'PY'
          import json
          import sys
          from pathlib import Path


          def load_state(path: Path) -> dict[str, int]:
              if not path.exists():
                  return {}
              payload = json.loads(path.read_text(encoding="utf-8"))
              return {str(channel): int(post_id) for channel, post_id in payload.items()}


          state_path = Path("data/state.json")
          snapshot_path = Path(sys.argv[1])
          latest_state = load_state(state_path)
          checked_state = load_state(snapshot_path)

          merged_state = dict(latest_state)
          for channel, post_id in checked_state.items():
              merged_state[channel] = max(post_id, merged_state.get(channel, post_id))

          state_path.parent.mkdir(exist_ok=True)
          state_path.write_text(
              json.dumps(merged_state, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

            git add data/state.json
            if git diff --cached --quiet; then
              echo "Yangi holat yo'q."
              exit 0
            fi

            git commit -m "Monitor holatini yangilash [skip ci]"
            if git push origin HEAD:"$GITHUB_REF_NAME"; then
              exit 0
            fi

            echo "Push paytida branch yangilandi. Qayta urinish: $attempt/3"
          done

          echo "State faylini 3 urinishdan keyin ham saqlab bo'lmadi."
          exit 1
